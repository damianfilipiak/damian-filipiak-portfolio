version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      major-updates:
        applies-to: version-updates
        update-types:
          - major
        patterns:
          - "*"
      three:
        patterns:
          - three
          - "@react-three/*"
      dev-tools:
        dependency-type: development
        update-types:
          - minor
          - patch
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
